<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IONM Owner Console</title>
  <link rel="stylesheet" href="/styles.css?v=20260622-features-v1">
  <style>
    .owner-shell { max-width: 1180px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; display: grid; gap: 1.5rem; }
    .owner-grid { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 1.5rem; align-items: start; }
    @media (max-width: 900px) { .owner-grid { grid-template-columns: 1fr; } }
    .owner-card { background: var(--panel, #11161f); border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 1.25rem 1.25rem 1.4rem; }
    .owner-card h3 { margin: 0 0 .25rem; }
    .owner-card .hint { color: rgba(255,255,255,.55); font-size: .85rem; margin: 0 0 1rem; }
    .owner-form { display: grid; gap: .75rem; }
    .owner-form label { display: grid; gap: .3rem; font-size: .85rem; color: rgba(255,255,255,.8); }
    .owner-form input, .owner-form select { width: 100%; padding: .55rem .65rem; border-radius: 8px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.04); color: inherit; font-size: .95rem; }
    .owner-form .row { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
    .owner-form .check { display: flex; align-items: center; gap: .5rem; font-size: .85rem; }
    .owner-form .check input { width: auto; }
    .tenant-table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    .tenant-table th, .tenant-table td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid rgba(255,255,255,.07); }
    .tenant-table th { color: rgba(255,255,255,.55); font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; }
    .badge { display: inline-block; padding: .15rem .55rem; border-radius: 999px; font-size: .72rem; font-weight: 600; }
    .badge.active, .badge.completed { background: rgba(34,197,94,.16); color: #4ade80; }
    .badge.pending, .badge.running { background: rgba(234,179,8,.16); color: #facc15; }
    .badge.failed, .badge.removed { background: rgba(239,68,68,.16); color: #f87171; }
    .req-item { border: 1px solid rgba(255,255,255,.08); border-radius: 10px; padding: .75rem .85rem; margin-bottom: .75rem; }
    .req-head { display: flex; justify-content: space-between; align-items: center; gap: .75rem; margin-bottom: .4rem; }
    .req-head strong { font-size: .95rem; }
    .req-log { margin: .4rem 0 0; padding: .6rem .7rem; background: #0a0e14; border-radius: 8px; max-height: 220px; overflow: auto; font-family: ui-monospace, "Cascadia Code", Menlo, monospace; font-size: .78rem; line-height: 1.45; white-space: pre-wrap; color: rgba(255,255,255,.82); }
    .req-result { margin-top: .45rem; font-size: .82rem; }
    .req-result a { color: #60a5fa; }
    .link-btn { background: none; border: none; color: #f87171; cursor: pointer; font-size: .8rem; padding: 0; text-decoration: underline; }
    .form-output { font-size: .85rem; min-height: 1.2em; }
    .form-output.error { color: #f87171; }
    .form-output.ok { color: #4ade80; }
    .refresh-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: .75rem; gap: .5rem; }
  </style>
</head>
<body class="admin-page">
  <header class="topbar">
    <div>
      <h1>IONM Owner Console</h1>
      <p>Πλατφόρμα · Διαχείριση εταιρειών (tenants)</p>
    </div>
    <nav class="top-nav" aria-label="Primary navigation">
      <a class="nav-link" href="/">Home</a>
      <a class="nav-link" href="/admin.html">Admin</a>
      <a class="nav-link active" href="/owner.html">Owner</a>
      <button class="nav-link nav-button" type="button" data-logout>Logout</button>
      <div class="status" id="owner-status">Σύνδεση...</div>
    </nav>
  </header>

  <main class="owner-shell">
    <div class="owner-grid">
      <section class="owner-card" id="create-card">
        <h3>Νέα εταιρεία</h3>
        <p class="hint">Δημιουργεί απομονωμένο instance: δική του βάση, υποτομέα, και τον έναν admin που θα παραδώσεις στον πελάτη.</p>
        <form id="create-form" class="owner-form">
          <label>
            Όνομα εταιρείας
            <input id="f-company" name="company" type="text" minlength="2" maxlength="160" required placeholder="π.χ. ACME Neuro Clinic">
          </label>
          <label>
            Slug (υποτομέας)
            <input id="f-slug" name="slug" type="text" pattern="[a-z0-9-]{3,32}" minlength="3" maxlength="32" required placeholder="acme">
          </label>
          <div class="row">
            <label>
              Γλώσσα
              <select id="f-lang" name="lang">
                <option value="el" selected>Ελληνικά</option>
                <option value="en">English</option>
              </select>
            </label>
            <label>
              Domain (προαιρετικό)
              <input id="f-domain" name="domain" type="text" maxlength="253" placeholder="acme.neuroionm.eu">
            </label>
          </div>
          <label>
            Admin username
            <input id="f-admin-user" name="admin_user" type="text" maxlength="120" placeholder="admin@acme">
          </label>
          <label>
            Admin password
            <input id="f-admin-pass" name="admin_password" type="password" minlength="8" maxlength="120" required autocomplete="new-password" placeholder="τουλάχιστον 8 χαρακτήρες">
          </label>
          <label class="check">
            <input id="f-tls" name="tls" type="checkbox" checked>
            Έκδοση TLS πιστοποιητικού τώρα (το DNS πρέπει να δείχνει ήδη στον server)
          </label>
          <button class="primary-btn" type="submit" id="create-submit">Δημιουργία εταιρείας</button>
          <div id="create-output" class="form-output"></div>
        </form>
      </section>

      <section class="owner-card" id="requests-card">
        <div class="refresh-row">
          <h3 style="margin:0">Πρόοδος αιτημάτων</h3>
          <button class="nav-link nav-button" type="button" id="refresh-requests">Ανανέωση</button>
        </div>
        <p class="hint">Ζωντανή εξέλιξη του provisioning (root daemon).</p>
        <div id="requests-list"></div>
      </section>
    </div>

    <section class="owner-card" id="tenants-card">
      <div class="refresh-row">
        <h3 style="margin:0">Εταιρείες</h3>
        <button class="nav-link nav-button" type="button" id="refresh-tenants">Ανανέωση</button>
      </div>
      <div id="tenants-list"></div>
    </section>
  </main>

  <script src="/owner.js?v=20260614-account-v1" type="module"></script>
</body>
</html>
